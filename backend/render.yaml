services:
  - type: web
    name: fraudlens-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://fraudlens.vercel.app"
      - key: FRAUDLENS_DB_PATH
        value: "/opt/render/project/src/backend/data/reviews.db"
